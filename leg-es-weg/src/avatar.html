<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Avatar</title>
<style>
  @font-face { font-family: "Fraunces"; src: url(fonts/fraunces-latin-full-normal.woff2) format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; background: #000; }
  .av { width: 1000px; height: 1000px; position: relative; overflow: hidden;
        background: radial-gradient(640px 640px at 50% 42%, #26375F 0%, #16213A 55%, #0F1729 100%);
        display: flex; align-items: center; justify-content: center; }
  .av span { font-family: "Fraunces", serif; font-weight: 600; font-size: 560px; line-height: 1; color: #F4EEE3;
             letter-spacing: -0.04em; transform: translate(18px, -18px); font-variation-settings: "SOFT" 50, "WONK" 0; }
  .av b { color: #F2703A; font-weight: 600; }
</style></head>
<body><div class="av" id="avatar"><span>L<b>.</b></span></div></body></html>
